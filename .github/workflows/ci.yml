name: CI — Fraud Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (CPU-only, no torch-geometric GPU wheels)
        run: |
          pip install --upgrade pip
          pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric==2.5.3
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src tests --max-line-length=120 \
            --exclude=src/models/tgn.py  # skip TGN (optional dep)

      - name: Check formatting with black
        run: |
          black src tests --check --line-length=120

      - name: Run unit tests (graph builder + features)
        run: |
          pytest tests/test_graph_builder.py tests/test_features.py \
            -v --tb=short --no-header

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --tb=short --no-header

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t fraud-detection-api:ci .

      - name: Smoke test Docker image
        run: |
          docker run -d --name fraud-api-test -p 8000:8000 fraud-detection-api:ci
          sleep 15
          curl -f http://localhost:8000/health || (docker logs fraud-api-test && exit 1)
          docker stop fraud-api-test
