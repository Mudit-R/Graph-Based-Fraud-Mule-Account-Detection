name: Fraud & Mule Detection Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov

    - name: Run Test Suite (59 Tests)
      run: |
        pytest tests/ -v --tb=short

    - name: Verify FastAPI Sentinel API
      run: |
        python -c "from src.api.main import app; print('FastAPI app loaded successfully:', app.title)"
