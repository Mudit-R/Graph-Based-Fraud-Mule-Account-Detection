version: '3.8'

services:
  # ── FastAPI Fraud Detection & Feature Store API ──────────────────────────────
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    depends_on:
      - redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Redis Nearline Cache & Feature Store ─────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    container_name: fraud_redis_cache
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Prometheus Observability & Metrics Scraper ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: fraud_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - fastapi-app
    restart: unless-stopped

volumes:
  redis_data:
