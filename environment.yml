name: fraud-detection
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  # ── PyTorch + CUDA ──────────────────────────────────────────────
  - pytorch::pytorch=2.4.0
  - pytorch::torchvision=0.19.0
  - pytorch::pytorch-cuda=12.1
  # ── Data & ML ───────────────────────────────────────────────────
  - conda-forge::pandas=2.2
  - conda-forge::polars=0.20
  - conda-forge::numpy=1.26
  - conda-forge::scipy=1.13
  - conda-forge::scikit-learn=1.5
  - conda-forge::xgboost=2.0
  - conda-forge::lightgbm=4.3
  - conda-forge::imbalanced-learn=0.12
  # ── Graph ───────────────────────────────────────────────────────
  - conda-forge::networkx=3.3
  # ── Viz ─────────────────────────────────────────────────────────
  - conda-forge::matplotlib=3.9
  - conda-forge::seaborn=0.13
  - conda-forge::plotly=5.22
  - conda-forge::pyvis=0.3.2
  # ── Explainability ──────────────────────────────────────────────
  - conda-forge::shap=0.45
  # ── Experiment Tracking ─────────────────────────────────────────
  - conda-forge::mlflow=2.14
  # ── API, Cache & Serving ─────────────────────────────────────────
  - conda-forge::fastapi=0.111
  - conda-forge::uvicorn=0.30
  - conda-forge::pydantic=2.7
  - conda-forge::httpx=0.27
  - conda-forge::redis-py=5.0
  - conda-forge::prometheus-client=0.20

  # ── Dev & Testing ───────────────────────────────────────────────
  - conda-forge::pytest=8.2
  - conda-forge::pytest-asyncio=0.23
  - conda-forge::black=24.4
  - conda-forge::flake8=7.1
  - conda-forge::tqdm=4.66
  - conda-forge::jupyter=1.0
  - conda-forge::jupyterlab=4.2
  - conda-forge::ipywidgets=8.1
  - conda-forge::kaggle=1.6
  # ── PyTorch Geometric (pip-installed for CUDA wheel support) ────
  - pip
  - pip:
    - torch-geometric==2.5.3
    - torch-scatter==2.1.2
    - torch-sparse==0.6.18
    - torch-cluster==1.6.3
    - torch-spline-conv==1.2.2
    - flower==1.8.0          # Federated learning (stretch goal)
    - python-multipart==0.0.9
    - loguru==0.7.2
    - rich==13.7.1
